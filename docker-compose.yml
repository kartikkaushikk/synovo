version: "3.9"

services:
  # ── Postgres ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cip
      POSTGRES_PASSWORD: cip_secret
      POSTGRES_DB: cip
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cip"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Qdrant ───────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FastAPI ───────────────────────────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # ── Celery Workers ────────────────────────────────────────────────────────
  worker-transcription:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app worker
      -Q transcription
      -c 2
      --loglevel=info
      --hostname=worker-transcription@%h
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
      - qdrant

  worker-diarization:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app worker
      -Q diarization
      -c 1
      --loglevel=info
      --hostname=worker-diarization@%h
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres

  worker-intelligence:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app worker
      -Q default,embedding,analytics,contradiction,topic
      -c 2
      --loglevel=info
      --hostname=worker-intelligence@%h
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - postgres
      - qdrant

  # ── Celery Beat (scheduled tasks) ─────────────────────────────────────────
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A workers.celery_app beat --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  # ── Flower (Celery dashboard) ─────────────────────────────────────────────
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      celery -A workers.celery_app flower
      --port=5555
      --basic_auth=admin:admin
    ports:
      - "5555:5555"
    env_file:
      - ./backend/.env
    depends_on:
      - redis

volumes:
  postgres_data:
  qdrant_data:
